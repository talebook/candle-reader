<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>candle-reader e2e harness</title>
  <!-- 与生产 index.html 一致，epub.js 以全局脚本方式引入 -->
  <script src="/js/epub-v0.3.88.js"></script>
  <script type="module">
    import { Reader } from "/src/main.js"
    // server 指向本地同源，使所有 /api/** 请求都走同源、便于 Playwright route mock；
    // book_url 指向「已解压的书目录」而非 .epub 压缩包：headless 下加载 zip（JSZip 异步解压）
    // 正文 iframe 常渲染不完整，改用解压目录后能稳定渲染，使依赖正文渲染的用例（如皮肤对
    // iframe color-scheme / 透明度的影响）可断言。
    new Reader('#app', {
      debug: false,
      themes_css: "/css/themes.css",
      server: window.location.origin,
      book_url: "/demo/book1/",
    })
  </script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
